<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Create Account • LEXON AI</title>

  <link rel="icon" href="../assets/logos/lexon-icon.svg">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      font-family: Inter, Arial, sans-serif;
      background:
        radial-gradient(circle at 15% 20%, rgba(99, 91, 255, 0.12), transparent 35%),
        radial-gradient(circle at 85% 80%, rgba(124, 92, 255, 0.10), transparent 35%),
        #f8f9ff;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      color: #151528;
    }

    .auth-wrapper {
      width: 100%;
      max-width: 440px;
    }

    .auth-card {
      background: rgba(255, 255, 255, 0.96);
      border: 1px solid rgba(99, 91, 255, 0.16);
      border-radius: 24px;
      padding: 34px;
      box-shadow: 0 20px 60px rgba(50, 45, 120, 0.12);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: #17172b;
      font-size: 20px;
      font-weight: 800;
      margin-bottom: 30px;
    }

    .brand img {
      width: 38px;
      height: 38px;
    }

    .heading {
      text-align: center;
      margin-bottom: 24px;
    }

    .heading h1 {
      font-size: 30px;
      line-height: 1.2;
      margin-bottom: 9px;
    }

    .heading p {
      color: #707087;
      font-size: 14px;
      line-height: 1.5;
    }

    .google-btn {
      width: 100%;
      height: 50px;
      border: 1px solid #dedee8;
      background: #fff;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      color: #20202d;
      cursor: pointer;
      transition: 0.2s ease;
    }

    .google-btn:hover {
      border-color: #635bff;
      box-shadow: 0 6px 18px rgba(99, 91, 255, 0.10);
      transform: translateY(-1px);
    }

    .google-icon {
      width: 20px;
      height: 20px;
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      color: #9999aa;
      font-size: 13px;
      margin: 22px 0;
    }

    .divider::before,
    .divider::after {
      content: "";
      height: 1px;
      background: #e8e8ef;
      flex: 1;
    }

    .field {
      margin-bottom: 16px;
    }

    .field label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
      color: #303044;
    }

    .input-wrap {
      position: relative;
    }

    .field input {
      width: 100%;
      height: 48px;
      border: 1px solid #dedee8;
      border-radius: 11px;
      padding: 0 44px 0 14px;
      outline: none;
      font-size: 14px;
      color: #17172b;
      background: #fff;
      transition: 0.2s ease;
    }

    .field input:focus {
      border-color: #635bff;
      box-shadow: 0 0 0 3px rgba(99, 91, 255, 0.10);
    }

    .show-btn {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      border: 0;
      background: transparent;
      color: #77778b;
      cursor: pointer;
      font-size: 12px;
      font-weight: 700;
    }

    .submit-btn {
      width: 100%;
      height: 50px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #635bff, #7b61ff);
      color: white;
      font-size: 15px;
      font-weight: 800;
      cursor: pointer;
      margin-top: 6px;
      transition: 0.2s ease;
      box-shadow: 0 10px 25px rgba(99, 91, 255, 0.22);
    }

    .submit-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 14px 30px rgba(99, 91, 255, 0.28);
    }

    .message {
      min-height: 20px;
      margin: 12px 0;
      text-align: center;
      font-size: 13px;
    }

    .footer {
      text-align: center;
      margin-top: 22px;
      font-size: 13px;
      color: #77778b;
    }

    .footer a {
      color: #635bff;
      font-weight: 800;
      text-decoration: none;
    }

    @media (max-width: 480px) {
      body {
        padding: 14px;
      }

      .auth-card {
        padding: 25px 20px;
        border-radius: 20px;
      }

      .heading h1 {
        font-size: 26px;
      }
    }
  </style>
</head>

<body>

  <div class="auth-wrapper">
    <div class="auth-card">

      <a href="../index.html" class="brand">
        <img src="../assets/logos/lexon-icon.svg" alt="LEXON AI">
        <span>LEXON AI</span>
      </a>

      <div class="heading">
        <h1>Create your account</h1>
        <p>Start learning, discovering and creating with AI.</p>
      </div>

      <button type="button" class="google-btn" id="googleSignupButton">
        <svg class="google-icon" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M21.35 12.23c0-.71-.06-1.4-.18-2.05H12v3.88h5.23a4.47 4.47 0 0 1-1.94 2.93v2.43h3.14c1.84-1.69 2.92-4.18 2.92-7.19z"/>
          <path fill="#34A853" d="M12 21.5c2.63 0 4.84-.87 6.45-2.36l-3.14-2.43c-.87.58-1.98.93-3.31.93-2.54 0-4.69-1.72-5.46-4.03H3.29v2.5A9.75 9.75 0 0 0 12 21.5z"/>
          <path fill="#FBBC05" d="M6.54 13.61a5.86 5.86 0 0 1 0-3.73v-2.5H3.29a9.74 9.74 0 0 0 0 8.73l3.25-2.5z"/>
          <path fill="#EA4335" d="M12 5.85c1.43 0 2.71.49 3.72 1.45l2.79-2.79C16.84 2.94 14.63 2 12 2a9.75 9.75 0 0 0-8.71 5.38l3.25 2.5C7.31 7.57 9.46 5.85 12 5.85z"/>
        </svg>
        Continue with Google
      </button>

      <div class="divider">or</div>

      <form id="signupForm">

        <div class="field">
          <label for="fullName">Full name</label>
          <input
            type="text"
            id="fullName"
            name="fullName"
            placeholder="Enter your full name"
            required
          >
        </div>

        <div class="field">
          <label for="email">Email address</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="you@gmail.com"
            required
          >
        </div>

        <div class="field">
          <label for="password">Password</label>
          <div class="input-wrap">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Create a password"
              minlength="8"
              required
            >
            <button type="button" class="show-btn" onclick="togglePassword('password', this)">Show</button>
          </div>
        </div>

        <div class="field">
          <label for="confirmPassword">Confirm password</label>
          <div class="input-wrap">
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Confirm your password"
              minlength="8"
              required
            >
            <button type="button" class="show-btn" onclick="togglePassword('confirmPassword', this)">Show</button>
          </div>
        </div>

        <div id="message" class="message"></div>

        <button type="submit" class="submit-btn">
          Create account
        </button>

      </form>

      <div class="footer">
        Already have an account?
        <a href="login.html">Sign in</a>
      </div>

    </div>
  </div>

  <script>
    function togglePassword(id, button) {
      const input = document.getElementById(id);

      if (input.type === "password") {
        input.type = "text";
        button.textContent = "Hide";
      } else {
        input.type = "password";
        button.textContent = "Show";
      }
    }
  </script>

  <script src="../js/supabase.js"></script>
  <script src="../js/auth.js"></script>
  <script src="../js/mode.js"></script>

  <script>
    (function () {
      var form = document.getElementById("signupForm");
      var nameInput = document.getElementById("fullName");
      var emailInput = document.getElementById("email");
      var passwordInput = document.getElementById("password");
      var confirmInput = document.getElementById("confirmPassword");
      var message = document.getElementById("message");
      var submitBtn = form.querySelector(".submit-btn");
      var submitLabel = submitBtn.textContent;
      var googleBtn = document.getElementById("googleSignupButton");

      function setMessage(text, isError) {
        message.textContent = text || "";
        message.style.color = isError ? "#e0344c" : "#1e9e5a";
      }

      function setLoading(isLoading, label) {
        submitBtn.disabled = isLoading;
        submitBtn.textContent = isLoading ? (label || "Please wait...") : submitLabel;
      }

      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        setMessage("");

        var name = nameInput.value.trim();
        var email = emailInput.value.trim();
        var password = passwordInput.value;
        var confirmPassword = confirmInput.value;

        if (!name || !email || !password || !confirmPassword) {
          setMessage("Please fill in all fields.", true);
          return;
        }

        if (password.length < 8) {
          setMessage("Password must be at least 8 characters.", true);
          return;
        }

        if (password !== confirmPassword) {
          setMessage("Passwords do not match.", true);
          return;
        }

        if (!window.LexonAuth || typeof window.LexonAuth.signUp !== "function") {
          setMessage("Sign up is currently unavailable. Please try again shortly.", true);
          return;
        }

        setLoading(true, "Creating account...");

        try {
          var result = await window.LexonAuth.signUp(email, password, name);

          if (!result.success) {
            setMessage(result.error || "Could not create account.", true);
            setLoading(false);
            return;
          }

          if (result.confirmationRequired) {
            form.style.display = "none";
            setMessage("Account created. Please check your email to confirm your address before signing in.", false);
            return;
          }

          setMessage("Account created successfully. Redirecting...", false);

          setTimeout(function () {
            window.location.href = "onboarding.html";
          }, 400);
        } catch (error) {
          setMessage((error && error.message) || "Unable to create account. Please try again.", true);
          setLoading(false);
        }
      });

      if (googleBtn) {
        googleBtn.addEventListener("click", async function () {
          setMessage("");

          if (!window.LexonAuth || typeof window.LexonAuth.loginWithGoogle !== "function") {
            setMessage("Google sign-up is currently unavailable.", true);
            return;
          }

          googleBtn.disabled = true;

          try {
            var result = await window.LexonAuth.loginWithGoogle();

            if (!result.success) {
              setMessage(result.error || "Could not start Google sign-in.", true);
              googleBtn.disabled = false;
            }
          } catch (error) {
            setMessage((error && error.message) || "Could not start Google sign-in.", true);
            googleBtn.disabled = false;
          }
        });
      }
    })();
  </script>

</body>
</html>
