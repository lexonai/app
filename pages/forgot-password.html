<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#635bff">
  <title>Forgot Password — LEXON AI</title>

  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../js/supabase.js" defer></script>
  <script src="../js/auth.js" defer></script>
</head>

<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">

      <a href="../index.html" class="auth-brand" aria-label="LEXON AI Home">
        <span class="brand-mark"><img src="../assets/logos/lexon-icon.svg" alt="LEXON AI"></span>
        <span class="brand-name">LEXON AI</span>
      </a>

      <div class="auth-header" id="stepRequestHeader">
        <h1>Forgot password?</h1>
        <p>Enter your email and we'll send you a link to reset it.</p>
      </div>

      <form id="requestForm" class="auth-form">
        <div class="form-group">
          <label for="email">Email address</label>
          <input type="email" id="email" name="email" autocomplete="email" placeholder="Enter your email" required>
        </div>

        <div id="requestMessage" class="form-message" role="alert" aria-live="polite"></div>

        <button type="submit" class="btn btn-primary auth-submit" id="requestButton">
          <span id="requestButtonText">Send reset link</span>
        </button>
      </form>

      <p class="auth-footer" style="margin-top:16px;">
        Remembered your password?
        <a href="login.html">Back to login</a>
      </p>

    </div>
  </div>

  <script>
    const form = document.getElementById("requestForm");
    const email = document.getElementById("email");
    const button = document.getElementById("requestButton");
    const buttonText = document.getElementById("requestButtonText");
    const message = document.getElementById("requestMessage");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      message.textContent = "";
      message.className = "form-message";

      const emailValue = email.value.trim();
      if (!emailValue) {
        message.textContent = "Please enter your email.";
        message.classList.add("error");
        return;
      }

      button.disabled = true;
      buttonText.textContent = "Sending...";

      try {
        if (!window.LexonAuth || typeof window.LexonAuth.resetPasswordForEmail !== "function") {
          throw new Error("This is currently unavailable.");
        }

        const result = await window.LexonAuth.resetPasswordForEmail(emailValue);

        if (!result.success) {
          throw new Error(result.error || "Could not send reset email.");
        }

        form.style.display = "none";
        document.getElementById("stepRequestHeader").innerHTML =
          "<h1>Check your email</h1><p>If an account exists for " + emailValue.replace(/</g, "&lt;") +
          ", a password reset link is on its way. It may take a minute to arrive.</p>";

      } catch (error) {
        message.textContent = error.message || "Something went wrong. Please try again.";
        message.classList.add("error");
        button.disabled = false;
        buttonText.textContent = "Send reset link";
      }
    });
  </script>
</body>
</html>
