<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/theme.js"></script>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#635bff">
  <title>Reset Password — LEXON AI</title>

  <link rel="manifest" href="../manifest.json">
  <link rel="stylesheet" href="../style.css">

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
  <script src="../js/supabase.js" defer></script>
  <script src="../js/auth.js" defer></script>
</head>

<body class="auth-page">
  <div class="auth-container">
    <div class="auth-card">

      <a href="../index.html" class="auth-brand" aria-label="LEXON AI Home">
        <span class="brand-mark"><img src="../assets/logos/lexon-icon.svg" alt="LEXON AI"></span>
        <span class="brand-name">LEXON AI</span>
      </a>

      <div class="auth-header">
        <h1>Set a new password</h1>
        <p>Choose a new password for your LEXON AI account.</p>
      </div>

      <form id="resetForm" class="auth-form">
        <div class="form-group">
          <div class="form-label-row">
            <label for="newPassword">New password</label>
          </div>
          <input type="password" id="newPassword" autocomplete="new-password" placeholder="Create a new password" minlength="6" required>
        </div>

        <div class="form-group">
          <div class="form-label-row">
            <label for="confirmNewPassword">Confirm new password</label>
          </div>
          <input type="password" id="confirmNewPassword" autocomplete="new-password" placeholder="Confirm your new password" minlength="6" required>
        </div>

        <div id="resetMessage" class="form-message" role="alert" aria-live="polite"></div>

        <button type="submit" class="btn btn-primary auth-submit" id="resetButton">
          <span id="resetButtonText">Update password</span>
        </button>
      </form>

    </div>
  </div>

  <script>
    const form = document.getElementById("resetForm");
    const newPassword = document.getElementById("newPassword");
    const confirmNewPassword = document.getElementById("confirmNewPassword");
    const button = document.getElementById("resetButton");
    const buttonText = document.getElementById("resetButtonText");
    const message = document.getElementById("resetMessage");

    form.addEventListener("submit", async function (event) {
      event.preventDefault();
      message.textContent = "";
      message.className = "form-message";

      if (newPassword.value.length < 6) {
        message.textContent = "Password must be at least 6 characters.";
        message.classList.add("error");
        return;
      }

      if (newPassword.value !== confirmNewPassword.value) {
        message.textContent = "Passwords do not match.";
        message.classList.add("error");
        return;
      }

      button.disabled = true;
      buttonText.textContent = "Updating...";

      try {
        if (!window.LexonAuth || typeof window.LexonAuth.updatePassword !== "function") {
          throw new Error("This is currently unavailable.");
        }

        const result = await window.LexonAuth.updatePassword(newPassword.value);

        if (!result.success) {
          throw new Error(result.error || "Could not update your password.");
        }

        message.textContent = "Password updated. Redirecting to login...";
        message.classList.add("success");

        setTimeout(() => {
          window.location.href = "login.html";
        }, 1200);

      } catch (error) {
        message.textContent = error.message || "Something went wrong. Please try again.";
        message.classList.add("error");
        button.disabled = false;
        buttonText.textContent = "Update password";
      }
    });
  </script>
</body>
</html>
