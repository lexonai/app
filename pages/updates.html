<!DOCTYPE html>
<html lang="en">
<head>
  <script src="../js/theme.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#635bff">
    <meta name="description" content="The latest AI tools, model releases and product updates.">
    <link rel="manifest" href="../manifest.json">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../style.css">
    <title>AI Updates — LEXON AI</title>
    <style>
        .page-shell {
            width: min(900px, calc(100% - 32px));
            margin: 0 auto;
            padding: 32px 0 110px;
        }

        .page-header h1 {
            margin: 0 0 8px;
            font-size: clamp(28px, 4vw, 42px);
            line-height: 1.1;
        }

        .page-header p {
            margin: 0 0 28px;
            color: #667085;
            max-width: 620px;
        }

        .update-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .update-card {
            display: flex;
            gap: 14px;
            padding: 18px;
            border: 1px solid #e4e7ec;
            border-radius: 16px;
            background: var(--lexon-surface);
            text-decoration: none;
            color: inherit;
        }

        .update-icon {
            flex-shrink: 0;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: rgba(99, 91, 255, 0.1);
            color: var(--lexon-accent);
            display: grid;
            place-items: center;
            font-weight: 700;
            font-size: 13px;
        }

        .update-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #98a2b3;
            margin-bottom: 4px;
        }

        .update-tag {
            display: inline-flex;
            padding: 2px 8px;
            border-radius: 999px;
            background: #f2f4f7;
            color: #475467;
            font-weight: 700;
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 0.02em;
        }

        .update-card h3 {
            margin: 0 0 4px;
            font-size: 15px;
        }

        .update-card p {
            margin: 0;
            font-size: 13.5px;
            color: #667085;
            line-height: 1.5;
        }

        .empty-state {
            display: none;
            text-align: center;
            padding: 56px 24px;
            border: 1px dashed #d0d5dd;
            border-radius: 20px;
            background: #fcfcfd;
        }

        .empty-state.visible { display: block; }

        .empty-state h2 {
            margin: 0 0 8px;
            font-size: 20px;
            color: var(--lexon-text);
        }

        .empty-state p {
            margin: 0 auto;
            max-width: 420px;
            color: #667085;
            line-height: 1.6;
        }

        @media (max-width: 640px) {
            .page-shell {
                width: min(100% - 24px, 900px);
                padding-top: 24px;
            }
        }
    </style>
</head>
<body>
    <header class="site-header">
        <div class="container header-inner">
            <a href="../index.html" class="brand" aria-label="Home">
                <span class="brand-mark" aria-hidden="true"><img src="../assets/logos/lexon-icon.svg" alt=""></span>
                <span class="brand-name">LEXON AI</span>
            </a>

            <nav class="desktop-nav" aria-label="Primary navigation">
                <a href="../index.html">Home</a>
                <a href="videos.html">Videos</a>
                <a href="courses.html">Courses</a>
                <a href="tools.html">Tools</a>
                <a href="guides.html">Guides</a>
            </nav>

            <div class="header-actions">
                <button class="icon-button" type="button" id="notificationButton" aria-label="Notifications">
                    <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                        <path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                    </svg>
                </button>
                <a href="profile.html" class="avatar-link" aria-label="Profile">
                    <span class="avatar" id="profileAvatar">?</span>
                </a>
            </div>
        </div>
    </header>

    <main class="page-shell">
        <section class="page-header">
            <h1>AI Updates</h1>
            <p>New AI tools, model releases and major product changes — added as they happen.</p>
        </section>

        <section class="update-list" id="updatesList" aria-live="polite"></section>

        <section class="empty-state" id="updatesEmpty">
            <h2>No updates yet</h2>
            <p>New AI tool releases, model updates and announcements will appear here as they're published.</p>
        </section>
    </main>

    <nav class="mobile-bottom-nav" aria-label="Mobile navigation">
        <a href="../index.html">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1V10Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
            </svg>
            <span>Home</span>
        </a>
        <a href="videos.html">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <rect x="3" y="5" width="18" height="14" rx="2" stroke="currentColor" stroke-width="1.8"/>
                <path d="m10 9 5 3-5 3V9Z" fill="currentColor"/>
            </svg>
            <span>Videos</span>
        </a>
        <a href="courses.html">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M4 5.5A2.5 2.5 0 0 1 6.5 3H20v16H6.5A2.5 2.5 0 0 0 4 21.5v-16Z" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"/>
                <path d="M4 5.5v16M8 7h8M8 11h8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span>Courses</span>
        </a>
        <a href="settings.html">
            <svg viewBox="0 0 24 24" fill="none" aria-hidden="true">
                <path d="M12 15.5a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7Z" stroke="currentColor" stroke-width="1.8"/>
            </svg>
            <span>Settings</span>
        </a>
    </nav>

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../js/supabase.js"></script>
    <script>
      (function () {
        "use strict";

        var listEl = document.getElementById("updatesList");
        var emptyEl = document.getElementById("updatesEmpty");
        var PAGE_SIZE = 20;
        var offset = 0;
        var loading = false;
        var reachedEnd = false;

        function escapeHTML(value) {
          var div = document.createElement("div");
          div.textContent = value == null ? "" : String(value);
          return div.innerHTML;
        }

        function formatDate(value) {
          if (!value) return "";
          try {
            return new Date(value).toLocaleDateString(undefined, {
              month: "short",
              day: "numeric",
              year: "numeric"
            });
          } catch (e) {
            return "";
          }
        }

        function renderBatch(updates) {
          var html = updates
            .map(function (update) {
              var title = escapeHTML(update.title || "Untitled update");
              var description = escapeHTML(update.description || update.summary || "");
              var tag = escapeHTML(update.category || update.tag || "AI Update");
              var date = formatDate(update.created_at || update.published_at);
              var url = update.url || update.link || "";
              var icon = title.charAt(0).toUpperCase() || "A";

              var body =
                '<div class="update-icon" aria-hidden="true">' + escapeHTML(icon) + '</div>' +
                '<div>' +
                  '<div class="update-meta">' +
                    '<span class="update-tag">' + tag + '</span>' +
                    (date ? '<span>' + date + '</span>' : "") +
                  '</div>' +
                  '<h3>' + title + '</h3>' +
                  (description ? '<p>' + description + '</p>' : "") +
                '</div>';

              return url
                ? '<a class="update-card" href="' + escapeHTML(url) + '" target="_blank" rel="noopener noreferrer">' + body + '</a>'
                : '<article class="update-card">' + body + '</article>';
            })
            .join("");

          listEl.insertAdjacentHTML("beforeend", html);
        }

        async function loadMore() {
          if (loading || reachedEnd) return;
          loading = true;

          try {
            var client = window.LexonSupabase && window.LexonSupabase.client();

            if (!client) {
              emptyEl.classList.add("visible");
              reachedEnd = true;
              return;
            }

            var result = await client
              .from("ai_updates")
              .select("*")
              .eq("status", "published")
              .order("created_at", { ascending: false })
              .range(offset, offset + PAGE_SIZE - 1);

            if (result.error || !Array.isArray(result.data) || !result.data.length) {
              if (offset === 0) emptyEl.classList.add("visible");
              reachedEnd = true;
              return;
            }

            emptyEl.classList.remove("visible");
            renderBatch(result.data);
            offset += result.data.length;

            if (result.data.length < PAGE_SIZE) {
              reachedEnd = true;
            }
          } catch (error) {
            if (offset === 0) emptyEl.classList.add("visible");
            reachedEnd = true;
          } finally {
            loading = false;
          }
        }

        // Infinite scroll — loads the next page only when the user
        // nears the bottom, instead of fetching everything at once.
        window.addEventListener("scroll", function () {
          if (window.innerHeight + window.scrollY >= document.body.offsetHeight - 400) {
            loadMore();
          }
        });

        (async function loadAvatar() {
          try {
            var client = window.LexonSupabase && window.LexonSupabase.client();
            if (!client) return;
            var userResult = await client.auth.getUser();
            var user = userResult.data && userResult.data.user;
            if (!user) return;
            var profileResult = await client.from("profiles").select("name, avatar_url").eq("id", user.id).maybeSingle();
            var profile = profileResult.data;
            var el = document.getElementById("profileAvatar");
            if (!el) return;
            if (profile && profile.avatar_url) {
              el.innerHTML = '<img src="' + escapeHTML(profile.avatar_url) + '" alt="" style="width:100%;height:100%;border-radius:50%;object-fit:cover;">';
            } else if (profile && profile.name) {
              el.textContent = profile.name.trim().charAt(0).toUpperCase();
            }
          } catch (error) {}
        })();

        loadMore();
      })();
    </script>
    <script src="../js/notifications.js"></script>
    <script src="../js/avatar.js"></script>
</body>
</html>
